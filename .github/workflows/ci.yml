name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers peft pytest ruff loguru
      - run: python -m py_compile speaker/*.py finetune/*.py pretrain/*.py baselines/*.py data/*.py tools/*.py tests/*.py
      - run: ruff check .
      - run: python -m pytest tests -q --ignore=tests/test_speaker_real.py --ignore=tests/test_scheduler_gpu.py
